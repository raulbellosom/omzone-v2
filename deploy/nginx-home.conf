# Include INSIDE the existing HTTPS server block for omzone.com.
# Keep its certificates, security headers, logs and redirects.
# Set its root to /srv/omzone/current/dist (adapt to the actual release path).

location = / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache off;
    proxy_buffering off;
    proxy_read_timeout 10s;
    proxy_intercept_errors off;
}

location = /es {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache off;
    proxy_buffering off;
    proxy_read_timeout 10s;
    proxy_intercept_errors off;
}

location = /es/ {
    return 308 /es$is_args$args;
}

location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location = /index.html {
    add_header Cache-Control "no-store" always;
}

location = /version.json {
    add_header Cache-Control "no-store" always;
}

# Keep SPA routes for administration, auth, catalog and portal.
location / {
    try_files $uri $uri/ /index.html;
}
